name: feed

on:
  schedule:
    - cron: '23 */3 * * *'   # UTC，每 3 小时（北京 08:23 11:23 14:23 …）
  workflow_dispatch:

concurrency:
  group: feed
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 拉取官方 ecfg 并本地解密
        run: python decrypt_nodes.py --lang default --out nodes.txt

      - name: 校验节点数量
        run: |
          n=$(wc -l < nodes.txt)
          echo "nodes: $n"
          [ "$n" -ge 100 ] || { echo "节点数量异常，终止"; exit 1; }

      - name: 发布到 feed 分支（分支内只含 nodes.txt）
        run: |
          git config user.name  "nodes-bot"
          git config user.email "nodes-bot@users.noreply.github.com"
          git checkout --orphan feed
          git rm -rf --cached . >/dev/null 2>&1 || true
          git add -f nodes.txt
          git commit -m "nodes: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push -f origin feed
